<svg width="840" height="230" viewBox="0 0 840 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="radarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="838" height="228" rx="18" fill="#0a0a0a" stroke="#232323" stroke-width="1"/>
  <rect x="1" y="1" width="838" height="228" rx="18" fill="url(#bgGlow)"/>

  <!-- text -->
  <text x="44" y="66" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#00ff88" letter-spacing="3">PIETRO RENZI</text>
  <text x="44" y="106" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">I make things that move,</text>
  <text x="44" y="142" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">look good <tspan fill="#00ff88">&amp;</tspan> sometimes work.</text>
  <text x="44" y="176" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9a9a9a">Creative Technologist · 3D · Motion · Frontend design · AI</text>
  <text x="44" y="200" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5f5f5f">Based in Italy · building worldwide</text>

  <line x1="44" y1="156" x2="480" y2="156" stroke="url(#line)" stroke-width="1" opacity="0.35"/>

  <!-- radar chart, reference-1 style -->
  <g transform="translate(680,115)">
    <circle cx="0" cy="0" r="95" fill="url(#radarGlow)"/>
    <!-- hex grid -->
    <g stroke="#2c2c2c" stroke-width="1" fill="none">
      <polygon points="0,-78 67.5,-39 67.5,39 0,78 -67.5,39 -67.5,-39"/>
      <polygon points="0,-58.5 50.6,-29.2 50.6,29.2 0,58.5 -50.6,29.2 -50.6,-29.2"/>
      <polygon points="0,-39 33.8,-19.5 33.8,19.5 0,39 -33.8,19.5 -33.8,-19.5"/>
      <polygon points="0,-19.5 16.9,-9.7 16.9,9.7 0,19.5 -16.9,9.7 -16.9,-9.7"/>
      <line x1="0" y1="-78" x2="0" y2="78"/>
      <line x1="-67.5" y1="-39" x2="67.5" y2="39"/>
      <line x1="-67.5" y1="39" x2="67.5" y2="-39"/>
    </g>
    <!-- star polygon -->
    <polygon points="0,-72 18,-22 62,-33 26,4 38,55 0,26 -38,55 -26,4 -62,-33 -18,-22"
             fill="#00ff88" fill-opacity="0.10" stroke="#00ff88" stroke-width="2" filter="url(#neon)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.08;0.18;0.08" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <!-- second shape offset like ref 1 -->
    <polygon points="0,-52 30,-15 45,28 0,50 -45,28 -30,-15"
             fill="none" stroke="#ffb347" stroke-width="1.5" stroke-opacity="0.75" filter="url(#neon)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite"/>
    </polygon>
    <!-- center diamond -->
    <rect x="-6" y="-6" width="12" height="12" transform="rotate(45)" fill="#0a0a0a" stroke="#00ff88" stroke-width="1.5"/>
    <!-- axis labels -->
    <g font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif" font-size="10" fill="#6f6f6f">
      <text x="0" y="-88" text-anchor="middle">3D</text>
      <text x="80" y="-40" text-anchor="start">Motion</text>
      <text x="80" y="48" text-anchor="start">Web</text>
      <text x="0" y="95" text-anchor="middle">AI</text>
      <text x="-80" y="48" text-anchor="end">Brand</text>
      <text x="-80" y="-40" text-anchor="end">UI/UX</text>
    </g>
  </g>
</svg>
